# A private, disposable stack. The fixture supplies its project name and random password.
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: ${REVUE_E2E_DB_PASSWORD}
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U e2e -d e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_interval: 1s
      start_period: 30s
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/e2e
      SPRING_DATASOURCE_USERNAME: e2e
      SPRING_DATASOURCE_PASSWORD: ${REVUE_E2E_DB_PASSWORD}
    ports:
      - "127.0.0.1::8080"
volumes:
  data:
