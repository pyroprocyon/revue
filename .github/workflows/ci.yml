name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REVUE_APP_IMAGE: revue-ci-app:${{ github.sha }}
      REVUE_DEV_IMAGE: revue-ci-dev:${{ github.sha }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Cache the SonarQube scanner and analyzers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/target/quality/sonar-scanner-cli.jar
            ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/check-sonar.py') }}

      - name: Prepare Docker dependency inputs
        id: docker-inputs
        run: |
          maven_cache="${MAVEN_USER_HOME:-$HOME/.m2}"
          npm_cache="$(npm config get cache --prefix frontend)/_cacache"
          mkdir -p "$maven_cache/repository" "$npm_cache"
          {
            printf 'maven_repository=%s\n' "$maven_cache/repository"
            printf 'npm_cacache=%s\n' "$npm_cache"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the app image for Playwright and smoke checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.REVUE_APP_IMAGE }}
          build-contexts: |
            maven-repository=${{ steps.docker-inputs.outputs.maven_repository }}
            npm-cacache=${{ steps.docker-inputs.outputs.npm_cacache }}
          cache-from: type=gha,scope=revue-app
          cache-to: type=gha,scope=revue-app,mode=max,ignore-error=true

      - name: Run the shared quality checks
        run: make quality PLAYWRIGHT_INSTALL_FLAGS=--with-deps

      - name: Build the Vite image for the smoke check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile.dev
          load: true
          tags: ${{ env.REVUE_DEV_IMAGE }}
          build-contexts: npm-cacache=${{ steps.docker-inputs.outputs.npm_cacache }}
          cache-from: type=gha,scope=revue-dev
          cache-to: type=gha,scope=revue-dev,mode=max,ignore-error=true

      - name: Check the local app using the prebuilt images
        run: make smoke COMPOSE_UP_BUILD=--no-build

      - name: Save quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/target/checkstyle-result.xml
            backend/target/quality/sonar-issues.json
            backend/target/quality/sonar-gate.json
            backend/target/quality/sonar-scope.json
            backend/target/quality/sonar-hotspots.json
            backend/target/quality/sonar-scanner.log
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose logs --no-color --tail=100
          fi

      - name: Clean up test containers
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down --volumes --remove-orphans
          fi
