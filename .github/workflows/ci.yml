name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false

      - name: Run tests, type checking and frontend build
        run: make check

      - name: Build containers and check the local app
        run: make smoke

      - name: Show container logs on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose logs --no-color --tail=100
          fi

      - name: Clean up test containers
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down --volumes --remove-orphans
          fi
