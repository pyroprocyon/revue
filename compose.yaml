# Local development stack. Use the Makefile (`make up`, `make db`, `make logs`, ...) rather than
# calling Docker Compose directly. Values come from .env, which `make up` creates from .env.example.
name: revue

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # 127.0.0.1 keeps the database reachable from this machine only.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images keep their data in /var/lib/postgresql/18/docker, so mount the
      # parent folder. The /var/lib/postgresql/data path from PostgreSQL 17 and older is wrong here.
      - db-data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 checks the TCP port. During first-time setup the image runs a temporary
      # server on the Unix socket only, so a socket check could report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # The runtime image has no curl or wget, so bash sends the HTTP request itself.
      # Healthy means /actuator/health answered {"status":"UP"}.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 2s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://backend:8080
      # Docker Desktop's WSL bind mounts can miss change events. Poll for reliable live reload.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    # Dependencies stay in the image, separate from host node_modules. Source edits reload live.
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

volumes:
  db-data:
