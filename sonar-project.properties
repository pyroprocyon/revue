sonar.projectKey=revue
sonar.projectName=Revue
sonar.sourceEncoding=UTF-8
sonar.sources=backend/src/main/java,frontend,scripts
sonar.tests=backend/src/test/java,frontend,scripts
sonar.test.inclusions=scripts/test_*.py,backend/src/test/java/**/*.java,frontend/**/*.test.ts,frontend/**/*.test.tsx,frontend/src/test/**,frontend/e2e/**/*.ts
sonar.exclusions=scripts/test_*.py,scripts/__pycache__/**,frontend/node_modules/**,frontend/dist/**,frontend/coverage/**,frontend/playwright-report/**,frontend/test-results/**,frontend/**/*.test.ts,frontend/**/*.test.tsx,frontend/src/test/**,frontend/e2e/**/*.ts
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.source=25
sonar.typescript.tsconfigPaths=frontend/tsconfig.json,frontend/tsconfig.e2e.json
sonar.working.directory=backend/target/sonar
# Every run starts with a fresh server: enforce overall issues, not a missing new-code baseline.
sonar.scm.disabled=true
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=180
