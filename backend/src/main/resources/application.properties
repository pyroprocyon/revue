spring.application.name=revue

# The database connection comes from environment variables, never from this file:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
# Docker Compose sets them from .env. The tests use a Testcontainers database instead.

# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The free database allows few connections, so keep the pool small. Idle connections close after
# a minute, so the database can pause when nobody studies.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# Spring Session's tables come from Flyway migration V1, not from Spring Boot.
spring.session.jdbc.initialize-schema=never
# A session ends after 7 days without a request, and each request moves that limit forward.
# The cookie is written at sign-in and lasts 30 days, longer than any session can stay idle,
# so the server-side limit decides when a student signs in again.
spring.session.timeout=7d
server.servlet.session.cookie.max-age=30d
# Scripts can't read the cookie. Requests from other sites carry it only when a person follows
# a link to Revue.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Spring Session's own cleanup would query the database every minute and keep it awake.
# ExpiredSessionCleanup runs it at startup and once a day instead.
spring.session.jdbc.cleanup-cron=-

# StaticResourceConfig serves the React build with its own cache rules.
spring.web.resources.add-mappings=false

# Readiness checks the database; liveness checks only the process.
# Frequent DB readiness probes keep a serverless database awake. Budget for this in production.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.distribution.percentiles-histogram.http.server.requests=true
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Native auth forms stay small; bound form parsing before allocating credential parameters.
server.tomcat.max-http-form-post-size=8KB
server.tomcat.max-parameter-count=8
