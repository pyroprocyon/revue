spring.application.name=revue

# The database connection comes from environment variables, never from this file:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
# Docker Compose sets them from .env. The tests use a Testcontainers database instead.

# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Spring Session's tables come from Flyway migration V1, not from Spring Boot.
spring.session.jdbc.initialize-schema=never

# The health endpoint is open (see SecurityConfig). It reports only UP or DOWN, with no details,
# and it never queries the database, so an uptime monitor can't wake a paused Neon database.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.db.enabled=false
# Spring Boot 4 adds Kubernetes-style liveness and readiness groups by default, and lists them in
# the response. Compose and the host call only /actuator/health, so turn them off.
management.endpoint.health.probes.enabled=false
