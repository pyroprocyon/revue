# Settings for the hosted service. The Docker image turns this profile on with
# SPRING_PROFILES_ACTIVE=prod, and Docker Compose turns it off for local development.

# The host tells the app which port to listen on through PORT (10000 by default on Render),
# and sends traffic and health checks there. Without PORT, the app keeps Spring Boot's 8080.
server.port=${PORT:8080}

# The host's proxy ends HTTPS and forwards plain HTTP. Reading its X-Forwarded headers makes the
# app treat each request as HTTPS, for example when it builds sign-in addresses for Google.
# The client address these headers give can be set by the client, so rate limits must not use it.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# The free instance has 512 MB of memory and 0.1 CPU, so fewer threads leave more memory for the
# heap. This is a starting value; measure memory under a short scripted load and adjust.
server.tomcat.threads.max=20
